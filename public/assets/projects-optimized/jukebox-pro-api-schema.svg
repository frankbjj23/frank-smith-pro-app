<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Jukebox Pro API database schema</title>
  <desc id="desc">Users own playlists, and playlists connect to tracks through a join table.</desc>
  <rect width="1200" height="750" fill="#eef3f7"/>
  <text x="70" y="78" fill="#0f2238" font-family="Arial, sans-serif" font-size="42" font-weight="700">Jukebox Pro</text>
  <text x="70" y="120" fill="#496174" font-family="Arial, sans-serif" font-size="24">Authenticated playlist API and relational data model</text>

  <g fill="none" stroke="#59758c" stroke-width="7">
    <path d="M355 300 H455"/>
    <path d="M745 300 H845"/>
    <path d="M600 420 V500"/>
  </g>
  <g fill="#127767">
    <circle cx="355" cy="300" r="9"/>
    <circle cx="455" cy="300" r="9"/>
    <circle cx="745" cy="300" r="9"/>
    <circle cx="845" cy="300" r="9"/>
    <circle cx="600" cy="420" r="9"/>
    <circle cx="600" cy="500" r="9"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(70 190)">
      <rect width="285" height="230" rx="12" fill="#ffffff" stroke="#c8d4de" stroke-width="3"/>
      <path d="M0 12 Q0 0 12 0 H273 Q285 0 285 12 V62 H0 Z" fill="#0f4c6d"/>
      <text x="24" y="41" fill="#ffffff" font-size="28" font-weight="700">users</text>
      <text x="24" y="105" fill="#0f2238" font-size="22">id</text>
      <text x="24" y="145" fill="#0f2238" font-size="22">username</text>
      <text x="24" y="185" fill="#0f2238" font-size="22">password hash</text>
    </g>

    <g transform="translate(455 190)">
      <rect width="290" height="230" rx="12" fill="#ffffff" stroke="#c8d4de" stroke-width="3"/>
      <path d="M0 12 Q0 0 12 0 H278 Q290 0 290 12 V62 H0 Z" fill="#0f4c6d"/>
      <text x="24" y="41" fill="#ffffff" font-size="28" font-weight="700">playlists</text>
      <text x="24" y="105" fill="#0f2238" font-size="22">id</text>
      <text x="24" y="145" fill="#0f2238" font-size="22">name + description</text>
      <text x="24" y="185" fill="#0f2238" font-size="22">user_id</text>
    </g>

    <g transform="translate(845 190)">
      <rect width="285" height="230" rx="12" fill="#ffffff" stroke="#c8d4de" stroke-width="3"/>
      <path d="M0 12 Q0 0 12 0 H273 Q285 0 285 12 V62 H0 Z" fill="#0f4c6d"/>
      <text x="24" y="41" fill="#ffffff" font-size="28" font-weight="700">tracks</text>
      <text x="24" y="105" fill="#0f2238" font-size="22">id</text>
      <text x="24" y="145" fill="#0f2238" font-size="22">name</text>
      <text x="24" y="185" fill="#0f2238" font-size="22">duration_ms</text>
    </g>

    <g transform="translate(455 500)">
      <rect width="290" height="170" rx="12" fill="#ffffff" stroke="#c8d4de" stroke-width="3"/>
      <path d="M0 12 Q0 0 12 0 H278 Q290 0 290 12 V62 H0 Z" fill="#127767"/>
      <text x="24" y="41" fill="#ffffff" font-size="26" font-weight="700">playlists_tracks</text>
      <text x="24" y="108" fill="#0f2238" font-size="22">playlist_id</text>
      <text x="24" y="145" fill="#0f2238" font-size="22">track_id</text>
    </g>

    <text x="365" y="280" fill="#496174" font-size="19">owns</text>
    <text x="754" y="280" fill="#496174" font-size="19">contains</text>
    <text x="625" y="468" fill="#496174" font-size="19">join table</text>
  </g>
</svg>
